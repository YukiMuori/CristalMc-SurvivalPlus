# DOCUMENTATION: https://docs.artillex-studios.com/axboosters.html

# DISCORD WEBHOOKS
# set to url to "" to disable
url: ''

# should only boosters with the GLOBAL audience trigger a webhook?
only-broadcast-global: true

# for more webhook options check out the docs: https://docs.artillex-studios.com/discord-webhook-builder.html
player-booster-start:
  enabled: true
  content: ''
  username: ''
  avatar-url: ''
  embeds:
  - title:
      text: '%display_name_uncolored% Started'
      url: ''
    description: ''
    color: '#00FF00'
    timestamp: '%timestamp%'
    image-url: ''
    thumbnail-url: ''
    video-url: ''
    author:
      name: ''
      icon-url: ''
      url: ''
    footer:
      icon-url: ''
      text: ''
    fields:
    - inline: true
      name: 'Started by:'
      value: '%player%'
    - inline: true
      name: 'Ends in:'
      value: '%time_formatted%'
    - inline: true
      name: 'Multiplier:'
      value: '%multiplier%'
    - inline: true
      name: 'Audience:'
      value: '%audience%'

player-booster-end:
  enabled: true
  content: ''
  username: ''
  avatar-url: ''
  embeds:
  - title:
