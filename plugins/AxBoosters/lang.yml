# DOCUMENTATION: https://docs.artillex-studios.com/axboosters.html

help:
- ' '
- <gradient:#0099FF:#00BBFF><b>AxBoosters</b></gradient> <#00AAFF>Help
- ' <#00AAFF>➤ <white>/axbooster <#DDDDDD>| <#55EEFF>Open booster menu'
- ' <#00AAFF>➤ <white>/axboosteradmin give <player> <booster> <audience> <multiplier> <length> [amount] <#DDDDDD>| <#55EEFF>Give a booster'
- ' <#00AAFF>➤ <white>/axboosteradmin starter <player> <booster> <audience> <multiplier> <length> [amount] <#DDDDDD>| <#55EEFF>Give a booster as a voucher'
- ' <#00AAFF>➤ <white>/axboosteradmin activate <player> <booster> <audience> <multiplier> <length> <#DDDDDD>| <#55EEFF>Activate a booster'
- ' <#00AAFF>➤ <white>/axboosteradmin apply <tool/armor> <booster> <multiplier> [player] <#DDDDDD>| <#55EEFF>Put boost on an item (hold the item in your hand)'
- ' <#00AAFF>➤ <white>/axboosteradmin unapply [booster] [player] <#DDDDDD>| <#55EEFF>Remove boost from an item (hold the item in your hand)'
- ' <#00AAFF>➤ <white>/axboosteradmin item <item-name> [player] [amount] <#DDDDDD>| <#55EEFF>Give boosted item to player'
- ' <#00AAFF>➤ <white>/axboosteradmin reload <#DDDDDD>| <#55EEFF>Reload plugin'
- ' <#00AAFF>➤ <white>/axboosteradmin listboosters <player> <#DDDDDD>| <#55EEFF>List boosters of player (or remove)'
- ' <#00AAFF>➤ <white>/axboosteradmin stop <player> [booster] <#DDDDDD>| <#55EEFF>Stop all active boosters of the player'
- ' <#00AAFF>➤ <white>/axboosteradmin stopall [booster] <#DDDDDD>| <#55EEFF>Stop all active boosters'
- ' <#00AAFF>➤ <white>/axboosteradmin debug <#DDDDDD>| <#55EEFF>Make the plugin automatically search for mistakes'
- ' '

reload:
  success: '&#33FF33Plugin successfully reloaded!'
  failed: '&#FF3333Failed to reload the plugin! Something is wrong in the &f%file%&#FF3333 file, look in the console or use a yaml validator to fix the errors!'

booster:
  activated: '&#33FF33You have activated a(n) &f%display_name% &#33FF33booster!'
  already-running: '&#FF3333Another &f%display_name% &#FF3333booster is already running!'

thanks:
  sent: '&#33FF33You have thanked &f%player% &#33FF33for starting a booster!'
  already: '&#FF3333You have already thanked &f%player%&#FF3333!'
  received: '&f%player% &#33FF33has thanked you for starting a booster!'
  self: '&#FF3333You can''t thank yourself!'
  expired: '&#FF3333This booster is no longer active!'

give:
  given: '&#33FF33You have given &f%amount%x %display_name% &#33FF33to &f%player%&#33FF33!'
  received: '&#33FF33You have received &f%amount%x %display_name% &#33FF33booster into your boost inventory! &7(/axboosters)'

item:
  given: '&#33FF33You have given &f%amount%x %name% &#33FF33booster item to &f%player%&#33FF33!'
  not-found: '&#FF3333This booster item can''t be found!'

starter:
  given: '&#33FF33You have given &f%amount%x %display_name% &#33FF33starter to &f%player%&#33FF33!'
  received: '&#33FF33You have received &f%amount%x %display_name% &#33FF33starter!'

apply:
  applied: '&#33FF33You have applied a(n) &f%display_name% &#33FF33booster to the item you are holding!'
  unapplied: '&#33FF33You have removed all boosters from the item that you are holding!'
  not-holding: '&#FF3333You are not holding any item!'

removed:
  success: '&#FF3333You have removed a booster from &f%player%&#FF3333!'
  not-found: '&#FF3333This player has 0 boosters.'

stop:
  not-running: '&#FF3333The player has no active boosters!'
  success: '&#33FF33You have successfully stopped all active boosters of &f%player%&#33FF33!'

stop-all:
  not-running: '&#FF3333There are no active boosters!'
  success: '&#33FF33You have successfully stopped all active boosters!'

debug:
  start: '&#33FF33Started searching for any possible issues, check the console for the results. Contact support if you need help understanding it. &#DDDDDD(provide logs if you do)'

audience:
  PERSONAL: PERSONAL
  TEAM: TEAM
  GLOBAL: GLOBAL

time:
  second: s
  minute: m
  hour: h
  day: d

placeholders:
  no-booster: '---'
  server: server

gui:
  no-boosts: ' &8❙ &#00FFFFThere are no active boosts!'
  boost: ' &8❙ &#00FFFF%multiplier% %boost%'

# note: the lines starting with %server-booster% and %player-booster% will be duplicated for every running booster, the rest is customizable!
# this will only be sent if it is enabled in the config and if there is at least 1 booster that affects them
join-message:
- ' '
- '<gradient:#0099FF:#00BBFF><b>AxBoosters</b></gradient> &7» &#00FFFFThere are some boosters active:'
- '%server-booster% &7- %display_name% &7(%time_formatted%)'
- '%player-booster% &7- &f%player%&#FFDD00''s %display_name% &7(%time_formatted%)'
- ' '

commands:
  invalid-value: '&#FF0000Invalid parameter: &#BB0000%value%'
  invalid-command: '&#FF0000Invalid command or subcommand!'
  missing-argument: '&#FF0000Missing argument! You must specify a value for &#BB0000%value%&#FF0000.'
  no-permission: '&#FF0000You don''t have permission to access this command!'
  out-of-range: '&#FF0000The &#BB0000%number% &#FF0000must be between &#BB0000%min% &#FF0000and &#BB0000%max%&#FF0000!'
  player-only: '&#FF0000You must be a player to use this command!'
  invalid-player: '&#FF0000The player &#BB0000%player% &#FF0000can not be found!'
  invalid-selector: '&#FF0000You can not use this selector in this command!'

# format: SOUND|VOLUME|PITCH
# example: ui.button.click|0.5|0.2
# set to "" to disable
sounds:
  booster-start: entity.experience_orb.pickup|1|1
  booster-end: entity.experience_bottle.throw|1|1

update-notifier: '&#77BBFFThere is a new version of AxBoosters available! &#DDDDDD(&#FFFFFFcurrent: &#FF0000%current% &#DDDDDD| &#FFFFFFlatest: &#00FF00%latest%&#DDDDDD)'

# do not change
version: 7
