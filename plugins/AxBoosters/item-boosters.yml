# DOCUMENTATION: https://docs.artillex-studios.com/axboosters.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html

# valid modes: hand, offhand, armor, inventory
# note: these use packet items, which means that you can change them at any point and all items will update

flying-helmet:
  material: TURTLE_HELMET
  glow: true
  name: <gradient:#0099FF:#00BBFF><b>Flying helmet</gradient>
  lore:
    # this line will be duplicated for every active boost, check the gui section in the lang.yml
    - ' '
    - '&#0099FFʙᴏᴏsᴛs'
    - '%boosts%'
    - ' '
  mode: armor
  boosts: # note: the name of the booster is always the Booster Type's configurations file's name (without the extension)
    # format: <BOOSTER TYPE>:<MULTIPLIER %> - this will not do anything if you don't have a Booster Type named the same
    - fly-booster:1

damage-sword:
  material: IRON_SWORD
  glow: true
  name: <gradient:#0099FF:#00BBFF><b>Strong Sword</gradient>
  lore:
  - ' '
  - '&#0099FFʙᴏᴏsᴛs'
  - '%boosts%'
  - ' '
  mode: hand
  boosts:
  - damage-booster:30
