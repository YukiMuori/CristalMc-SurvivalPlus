title: '&0&lAxBoosters > &8Main menu'
# a gui can have 1-6 rows
rows: 5

# ----- ITEMS -----

filler:
  name: ' '
  slot:
  - 0-9
  - 17-18
  - 26-27
  - 35-44
  type: LIGHT_BLUE_STAINED_GLASS_PANE

active-boosters:
  slot: 20
  name: '&#0099FF&lACTIVE BOOSTERS'
  type: CLOCK
  lore:
  - ' '
  - ' &7- &fThere are currently &#00FFFF%amount% &factive boosters!'
  - ' '
  - '&#0099FF&l(!) &#0099FFClick here to view them!'
  actions:
  - '[MENU] active-boosters'
  - '[SOUND] ui.button.click|1|1'

stats:
  slot: 22
  name: '&#0099FF&lSTATISTICS'
  type: PLAYER_HEAD
  lore:
    # this line will be duplicated for every active boost, check the gui section in the lang.yml
    - ' '
    - '&#0099FFʙᴏᴏsᴛs'
    - '%boosts%'
    - ' '
    - '&#0099FF&l(!) &#0099FFThis item shows all the boosters that affect you'

my-boosters:
  slot: 24
  name: '&#0099FF&lMY BOOSTERS'
  type: CHEST
  lore:
  - ' '
  - ' &7- &fYou have &#00FFFF%amount% &funused boosters!'
  - ' '
  - '&#0099FF&l(!) &#0099FFClick here to view them!'
  actions:
  - '[MENU] my-boosters'
  - '[SOUND] ui.button.click|1|1'

