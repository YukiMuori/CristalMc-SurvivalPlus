# DOCUMENTATION: https://docs.artillex-studios.com/axboosters.html

# READ BEFORE EDITING:
# in this file you can create custom boosters for any external plugin straight here without any programming required
# note that a good understanding of the bukkit api is recommended before touching this file,
# so most people probably should leave this as it is

# how it works?
# the plugin uses the java reflection api to create a listener for all the configured booster event classes
# - the name of the section (for example: vanilla:experience) is the internal name of the booster, you can give it any name that you like (!! it must be all in lowercase, and it must follow the convention: <plugin-name>:<booster-name>)
# - icon: the icon material shown in the /axboosteradmin editor
# - event: the full path to the event class (this class must be extending the org.bukkit.event.Event class!)
# - player: the method to get the Player object (the plugin can also transform UUID and OfflinePlayer automatically) from the event (you can also get them from subclasses, for example if you use "event.getUser().getPlayer()", here you can set it to "getUser.getPlayer")
# - getter: the method to get the value to change (the method must not have any parameters and the return value must be a type of something that extends the Number class - so for example a double or a long)
# - setter: the method to set the updated value (the method must have only 1 parameter, which extends the Number class)
#
# if you need an example, check out the "axsellwands:sell_money" booster here and its code (https://github.com/Artillex-Studios/AxSellwands/blob/master/src/main/java/com/artillexstudios/axsellwands/api/events/AxSellwandsSellEvent.java)

# good to know:
# - AxBoosters will check on startup to see if the event class exists, if it doesn't, you won't be able to see the booster hook
# - some external plugin events are not possible to add as boosters if they don't have api events or if they are too complicated for this simple system
# - you are responsible for testing all the booster hooks that you add, some plugins can have exploits if you are not careful (usually economy plugins with a pay command or shops)
# - the default configuration contains some commented out booster hooks, but they are also supported, however due to some limitation this system doesn't work for them and they had to be added into the code directly

# ==================
#  VANILLA BOOSTERS
# ==================

vanilla:experience:
  icon: EXPERIENCE_BOTTLE
  event: org.bukkit.event.player.PlayerExpChangeEvent
  player: getPlayer
  getter: getAmount
  setter: setAmount

