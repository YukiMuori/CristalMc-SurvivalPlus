# Login/Logout
JoinMessage: '<#2ecc71>[+] <white>%playerDisplayName%'
QuitMessage: '<#e74c3c>[-] <white>%playerDisplayName%'
FirstJoinMessage: '<gold>✨ Benvenuto <white>%playerDisplayName% <gold>in Survival+! ✨'

# Teleport Messages
TeleportedToPlayer: '<green>Teletrasportato da <white>%player%'
