# ============================================
# CMI Minimal Italian Messages for Survival+
# Using MiniMessage format with HEX colors and clickable buttons
# ============================================

# General
NoPermission: '<red>Non hai il permesso per eseguire questo comando!'
NoPermissionNode: '<red>Permesso richiesto: <white>%permission%'
UnknownCommand: '<gray>Comando sconosciuto. Usa <white>/cmi help'
OnlyPlayers: '<red>Solo i giocatori possono eseguire questo comando!'
