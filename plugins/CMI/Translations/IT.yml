# TPA Messages (with clickable buttons)
TeleportRequest: '<#3498db>%playerDisplayName% <white>vorrebbe venire da te! <#3498db>[<hover:show_text:"<green>Clicca per accettare">Accetta<click:run_command:/tpaccept>] <#e74c3c>[<hover:show_text:"<red>Clicca per rifiutare">Rifiuta<click:run_command:/tpdeny>]'
TeleportRequestSent: '<green>Richiesta di teletrasporto inviata a <white>%player%'
