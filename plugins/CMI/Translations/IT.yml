# TPA Here Messages
TeleportHereRequest: '<#3498db>%playerDisplayName% <white>vuole che tu vada da lui! <#3498db>[<hover:show_text:"<green>Clicca per accettare">Accetta<click:run_command:/tpaccept>] <#e74c3c>[<hover:show_text:"<red>Clicca per rifiutare">Rifiuta<click:run_command:/tpdeny>]'
