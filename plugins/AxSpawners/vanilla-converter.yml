# DOCUMENTATION: https://docs.artillex-studios.com/axspawners.html

# if enabled, when players break vanilla minecraft spawners, they will get an ax spawner
enabled: false

# what should each of these spawners be converted to?
# any spawner not on the list will be ignored by axspawners, and they will continue to work as a normal vanilla spawner
# format: <entity type>: <spawner id>
# entity types: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
# spawner ids are the name of the files in the spawners folder (without the .yml extension)
BLAZE: blaze
CHICKEN: chicken
COD: cod
COW: cow
CREEPER: creeper
ENDERMAN: enderman
GHAST: ghast
GLOW_SQUID: glow_squid
GUARDIAN: guardian
HORSE: horse
IRON_GOLEM: iron_golem
MAGMA_CUBE: magma_cube
PHANTOM: phantom
PIG: pig
PUFFERFISH: pufferfish
RABBIT: rabbit
SALMON: salmon
SHEEP: sheep
SHULKER: shulker
SKELETON: skeleton
SLIME: slime
SPIDER: spider
SQUID: squid
TROPICAL_FISH: tropical_fish
WITHER_SKELETON: wither_skeleton
ZOMBIE: zombie

# do not change this
version: 1
