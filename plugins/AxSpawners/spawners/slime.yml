# DOCUMENTATION: https://docs.artillex-studios.com/axspawners.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html
# note: default files only use loot-tables and level formulas, check the _example.yml for the full list of options (like manual drops & level pricing)

item:
  material: PLAYER_HEAD
  texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjhkOWMwMjM3MzZjYmJjOTc5MTY0YWU4MjAxYmI0OTFhOTE0NmUyNzkxYTBmMTRiZDZmNGJjMjc2YmY4NGM3OSJ9fX0=
  name: "<#AAFFAA>%amount% <#00FF00><bold>ꜱʟɪᴍᴇ</bold> <white>Spawner"
  lore:
    - ""
    - "<#00FF00><bold>></bold> <#AAFFAA>Level: <#00FF00>%level%"
    - ""
    - "<#00FF00>ꜱᴛᴀᴛꜱ"
    - " <#555555>❙ <#FFFFFF>Speed: <#00FF00>%speed% seconds"
    - " <#555555>❙ <#FFFFFF>Dropped XP: <#00FF00>%xp%"
    - " <#555555>❙ <#FFFFFF>XP Storage: <#00FF00>%max-xp%"
    - " <#555555>❙ <#FFFFFF>Loot Slots: <#00FF00>%max-slots%"
    - ""
    - "<#00FF00>ᴅʀᴏᴘꜱ"
    - " <#555555>❙ <#FFFFFF>%drop% <#AAAAAA>(<#00FF00>%chance%%<#AAAAAA>)" # the line containing %drop% will be duplicated for every possible drop
    - ""
    - "<#00FF00><bold>></bold> <#AAFFAA>This spawner automatically generates items."

# what type of block should the spawner be?
# note: this won't be automatically updated, it will only apply to newly placed spawners
spawner-block:
  material: SPAWNER

# the item which will be spinning inside the spawner block
# remove the section to disable
spawner-block-item:
  material: PLAYER_HEAD
  texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjhkOWMwMjM3MzZjYmJjOTc5MTY0YWU4MjAxYmI0OTFhOTE0NmUyNzkxYTBmMTRiZDZmNGJjMjc2YmY4NGM3OSJ9fX0=

# item shown in the /myspawners command
gui-item:
  material: PLAYER_HEAD
  texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjhkOWMwMjM3MzZjYmJjOTc5MTY0YWU4MjAxYmI0OTFhOTE0NmUyNzkxYTBmMTRiZDZmNGJjMjc2YmY4NGM3OSJ9fX0=
  name: "<#AAFFAA>%amount% <#00FF00><bold>ꜱʟɪᴍᴇ</bold> <white>Spawner <#AAFFAA>(Level %level%)"
  lore:
    - "&#DDDDDDLocation: %world%; %x%; %y%; %z%"
    - ""
    - "<#00FF00><bold>></bold> <#AAFFAA>Next Spawn: <#00FF00>%next-spawn% seconds"
    - ""
    - "<#00FF00>ꜱᴛᴏʀᴀɢᴇ"
    - " <#555555>❙ <#FFFFFF>XP Storage: <#00FF00>%xp-bar% &#AAAAAA(%xp-percentage%%)"
    - " <#555555>❙ <#FFFFFF>Loot Slots: <#00FF00>%slots-bar% &#AAAAAA(%slots-percentage%%)"
    - ""
    - "<#00FF00>Left Click <bold>></bold> <#AAFFAA>Open Spawner"
    - "<#00FF00>Right Click <bold>></bold> <#AAFFAA>Sell Loot & Withdraw XP"

hologram:
  enabled: true
  height: 1.3
  lines:
      - "<#FFFFFF>%amount% <#00FF00><bold>ꜱʟɪᴍᴇ</bold> <white>Spawner <#AAFFAA>(Level %level%)"
      - ""
      - "<#FFFFFF>XP Storage: <#AAFFAA>%xp-bar% &#AAAAAA(%xp-percentage%%)"
      - "<#FFFFFF>Loot Slots: <#AAFFAA>%slots-bar% &#AAAAAA(%slots-percentage%%)"
      - ""
      - "<#AAFFAA>Spawning in <bold>></bold> <#FFFFFF>%next-spawn% seconds"

levels:
  price-calculation:
    # note: levels start from 1 and these are the cost of upgrading from that level, so to go from level 1 to level 2, the level 1 price will be used
    type: "formula"
    formula: "%level% ^ 5 * 1000"
  # the list of levels (you can configure any amount of levels)
  # make sure that you set a price for all levels if you are using manual price-calculation
  upgrades:
    # level 1 (DEFAULT LEVEL)
    1:
      # time it takes to generate loot (in seconds)
      # you can also set a range (like: 5-10) to make generation a bit more random
      speed: 50-60
      storage:
        # the max xp that the spawner can store
        xp: 150
        # the amount of slots where loot can go (the plugin support any number of slots)
        slots: 3
      loot:
        # how much xp should one mob drop? (can be a range, like 5-10)
        experience: 1-5
        type: loot-table
        # if loot-table type is used, name of the loot table (https://mcreator.net/wiki/minecraft-vanilla-loot-tables-list)
        loot-table:
          value: "entities/slime"
          multiplier: 1
    # level 2
    2:
      speed: 45-55
      storage:
        xp: 300
        slots: 9
      loot:
        experience: 3-5
        type: loot-table
        loot-table:
          value: "entities/slime"
          multiplier: 1.1
    # level 3
