# DOCUMENTATION: https://docs.artillex-studios.com/axspawners.html

# what plugin to use?
# used for calculating spawner drop value
# if multiple is enabled, the highest sell value will be used
price-plugins:
  ShopGUIPlus: true
  Essentials: true
  EconomyShopGUI: true
  CMI: true
  ExcellentShop: true
  EssentialsX: true
  AxGens: true
  zShop: true

# list of supported plugins: https://docs.artillex-studios.com/axspawners-supported-plugins.html#currency
# used for spawner upgrades and for the spawner shop
currency-plugins:
  plugin: Vault
  # this value is only used when the plugin supports multiple currencies
  currency: ''

# list of supported plugins: https://docs.artillex-studios.com/axspawners-supported-plugins.html#currency
# sellwands will give this currency
# if the plugin field is left empty, then the currency-plugins section will be used
sell-currency-plugins:
  plugin: ''
  # this value is only used when the plugin supports multiple currencies
  currency: ''

# what plugin to use?
protection-plugins:
  BentoBox: true
  GriefPrevention: true
  HuskTowns: true
  IridiumSkyBlock: true
  KingdomsX: true
  Lands: true
  PlotSquared: true
  SuperiorSkyBlock2: true
  WorldGuard: true
  Towny: true
  Residence: true
  ExcellentEconomy: true
  IridiumSkyblock: true
  HuskClaims: true
  SimpleClaimSystem: true

other-plugins:
  # allows sellwands to sell directly from spawners
  AxSellwands: true
  # https://docs.artillex-studios.com/shopguiplus-support.html
  ShopGUIPlus: true

# do not change this
version: 6
