# DOCUMENTATION: https://docs.artillex-studios.com/axspawners.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html

# list of wand types: sell, xp
type: xp

item:
  material: BLAZE_ROD
  name: "<#AAFFAA>%multiplier%x <#00FF00>xᴘ <white>Wand <#AAAAAA>(%uses% uses)"
  lore:
    - ""
    - "<#00FF00>ꜱᴛᴀᴛꜱ"
    - " <#555555>❙ <#FFFFFF>Multiplier: <#00FF00>%multiplier%x"
    - " <#555555>❙ <#FFFFFF>Uses: <#00FF00>%uses%"
    - " <#555555>❙ <#FFFFFF>Radius: <#00FF00>%radius% blocks"
    - " <#555555>❙ <#FFFFFF>Allowed spawners: <#00FF00>all"
    - ""
    - "<#00FF00>ᴇᴀʀɴɪɴɢꜱ"
    - " <#555555>❙ <#FFFFFF>Usage times: <#00FF00>%items-sold%"
    - " <#555555>❙ <#FFFFFF>XP withdrawn: <#00FF00>%money-made%"
    - ""
    - "<#00FF00><bold>></bold> <#AAFFAA>Right click to withdraw all xp from nearby spawners."

# which spawners can this wand be used on?
# the spawner names must be the same as the file name in the spawners folder (without the .yml)
# use * to allow the wand to be used on all spawners
allowed-spawners:
  - "*"

# how often should the sellwand be usable?
# in milliseconds, set to -1 to disable
usage-cooldown: 1000

# when using the wand, what particle color should be used?
# format: <RED>;<GREEN>;<BLUE>
particle-color: "0;255;0"