title: 'Whitelisted Players <#404040>(page #%page%)'
# a gui can have 1-6 rows
rows: 5
# how many items should be shown on a single page?
# this mustn't be more than the amount of air slots
page-size: 21

# ----- ITEMS -----

# this item is used for all the whitelisted players
whitelisted-player-item:
  material: WHITE_CANDLE
  name: '&#00AAFF&l%player%'
  lore:
  - ' '
  - ' &fThis player can upgrade, boost,'
  - ' &fwithdraw xp and loot from the spawner!'
  - ' '
  - '&#00AAFFClick &#00AAFF&l> &#00DDFFRemove from Whitelist'

