  - ' <#555555>❙ <#FFFFAA>%booster-xp-multiplier%x <#FFCC00>xᴘ <white>Booster <#AAAAAA>(%booster-xp-time%)'
  - ' '
  - '&#00AAFFClick &#00AAFF&l> &#00DDFFTake Out Boosters'
