  material: ARROW
  name: '&#00AAFF&lᴘʀᴇᴠɪᴏᴜs ᴘᴀɢᴇ'
  lore:
  - ' '
  - ' &fClick here to go back'
  - ' &fto the previous page!'
  - ' '
  - '&#00AAFFClick &#00AAFF&l> &#00DDFFPrevious Page'
