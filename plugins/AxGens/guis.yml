# DOCUMENTATION: https://docs.artillex-studios.com/axgens.html

upgrade-menu:
  # a gui can only have 1-6 rows
  rows: 3
  # valid values: CHEST, WORKBENCH, HOPPER, DISPENSER, BREWING
  type: DISPENSER
  title: '%generator-name%'
  filler:
    slot:
    - 0
    - 1
    - 2
    - 3
    - 5
    - 6
    - 7
    - 8
    material: LIME_STAINED_GLASS_PANE
    name: ' '
  upgrade-item:
    slot: 4
    material: BELL
    name: '&#33FF33&lUPGRADE'
    lore:
    - ' '
    - ' &7- &fPrice: &#33FF33%price%$'
    - ' &7- &fRequired level: &#33FF33%level-needed%'
    - ' '
    - '&#33DD33ᴄᴜʀʀᴇɴᴛ'
    - ' &8❙ &fTier: &#33DD33%current-tier%'
    - ' &8❙ &fSpeed: &#33DD33%current-speed% seconds'
    - ' &8❙ &fDrop price: &#33DD33%current-sell-price%$'
    - ' '
    - '&#33EE33ᴜᴘɢʀᴀᴅᴇᴅ'
    - ' &8❙ &fTier: &#33EE33%next-tier%'
    - ' &8❙ &fSpeed: &#33EE33%next-speed% seconds'
    - ' &8❙ &fDrop price: &#33EE33%next-sell-price%$'
    - ' '
    - '&#33FF33&l(!) &#33FF33Click here to upgrade!'
  # this will replace the upgrade-item if this is the last tier
  upgrade-item-maxed:
    slot: 4
    material: BELL
    name: '&#FF3333&lMAXED'
    lore:
    - ' '
    - '&#EE3333ᴄᴜʀʀᴇɴᴛ'
    - ' &8❙ &fTier: &#EE3333%current-tier%'
    - ' &8❙ &fSpeed: &#EE3333%current-speed% seconds'
    - ' &8❙ &fDrop price: &#EE3333%current-sell-price%$'
    - ' '
    - '&#FF3333&l(!) &#FF3333This is the max tier!'
