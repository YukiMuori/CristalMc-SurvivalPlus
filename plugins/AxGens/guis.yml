    lore:
    - ' '
    - ' &7- &fGoes to the previous page!'
    - ' '
    - '&#FF3333&l(!) &#FF3333Click here!'
  next-page:
    slot: 51
    material: ARROW
    name: '&#FF3333&lNEXT PAGE'
    lore:
    - ' '
    - ' &7- &fGoes to the next page!'
    - ' '
    - '&#FF3333&l(!) &#FF3333Click here!'
