#    slot: 10
#    type: STONE
#    name: "&eDecoration!"

# this menu is only used when corrupted generators are enabled in the config
corrupted-menu:
  # a gui can only have 1-6 rows
  rows: 3
  # valid values: CHEST, WORKBENCH, HOPPER, DISPENSER, BREWING
  type: DISPENSER
  title: '%generator-name%'
  filler:
    slot:
    - 0
    - 1
    - 2
    - 3
    - 5
    - 6
    - 7
    - 8
    material: RED_STAINED_GLASS_PANE
    name: ' '
  repair-item:
    slot: 4
    material: IRON_PICKAXE
    name: '&#FF3333&lREPAIR'
    lore:
    - ' '
    - ' &7- &fPrice: &#FF3333%price%$'
    - ' '
    - '&#FF3333&l(!) &#FF3333Click here to repair!'

