  filler:
    slot:
    - 45
    - 46
    - 48
    - 50
    - 52
    - 53
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  pickup-all:
    slot: 0
    material: BARRIER
    name: '&#FF3333&lPICKUP ALL'
