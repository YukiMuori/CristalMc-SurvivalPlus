    - ' &8❙ &fTier: &#33DD33%tier%'
    - ' &8❙ &fSpeed: &#33DD33%speed%'
    - ' '
    - '&#33DD33ᴅʀᴏᴘ'
    - ' &8❙ &fItem: &#33DD33%drop-material%'
    - ' &8❙ &fSell-price: &#33DD33%sell-price%'
    - ' '
    - '&#33FF33&l(!) &#33FF33Click here to pick up!'

shop-menu:
  # a gui can only have 1-6 rows
  rows: 6
  # how many item should be shown on a single page?
  page-size: 45
  title: '&0&lɢᴇɴᴇʀᴀᴛᴏʀ sʜᴏᴘ'
  filler:
    slot:
    - 45
    - 46
    - 48
    - 50
    - 52
    - 53
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  close:
    slot: 49
    material: BARRIER
    name: '&#FF3333&lCLOSE'
    lore:
    - ' '
    - ' &7- &fCloses the gui!'
    - ' '
    - '&#FF3333&l(!) &#FF3333Click here!'
  previous-page:
    slot: 47
    material: ARROW
    name: '&#FF3333&lPREVIOUS PAGE'
    lore:
    - ' '
    - ' &7- &fGoes to the previous page!'
    - ' '
    - '&#FF3333&l(!) &#FF3333Click here!'
  next-page:
    slot: 51
    material: ARROW
    name: '&#FF3333&lNEXT PAGE'
    lore:
    - ' '
    - ' &7- &fGoes to the next page!'
    - ' '
    - '&#FF3333&l(!) &#FF3333Click here!'
  # used for the generator's lore
  buyable-item-overwrite:
    lore:
    - ' '
    - ' &7- &fPrice: &#33FF33%price%$'
