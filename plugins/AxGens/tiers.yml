# DOCUMENTATION: https://docs.artillex-studios.com/axgens.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html

# placeholders:
#  %tier%
#  %buy-price%$
#  %speed%
#  %drop-name%
#  %drop-material%
#  %drop-name-<number>%
#  %drop-material-<number>%
#  %drop-chance-<number>%
#  %sell-price%
#  %sell-price-<number%
#  %upgrade-price%
#  %repair-cost%
#
# hologram only:
#  %next-spawn%/%spawn-time%

# item builder options: (they are all optional)
#
# note: to use custom-block-id you MUST have Oraxen or ItemsAdder
#
# item:
#  material: LEATHER_HELMET
#  custom-block-id: "my_block"
#  color: "255, 50, 50"
#  name: "<red>Example"
#  lore:
#    - "&7multi line"
#    - "&#FF3333lore"
#  glow: true
#  custom-model-data: 100
#  enchantments:
#    sharpness: 1

# you can add as many tiers as you want
# the tier's name MUST be an integer (1, 2, 3 ..)
# you also shouldn't skip tiers, because it will cause errors
tiers:
  '1':
    generator-item:
      # you can add this to all the tiers and set it to true if you want to remove them from the shop
      remove-from-shop: false
      # set this to false if you only want to display the generator in the shop
      allow-buying: true
      material: HAY_BLOCK
      name: '&#FFCC00&lWHEAT GENERATOR'
      # what level do you need to upgrade or buy this generator?
      level-requirement: 0
      # you must have a compatible economy plugin
      price: 1000.0
      # speed is in seconds (20 seconds = 1 second), lower = faster
      speed: 600
      lore:
      - ''
      - '&#FFCC00sᴛᴀᴛs'
      - ' &8❙ &fTier: &#FFCC00%tier%'
      - ' &8❙ &fPrice: &#FFCC00%buy-price%$'
      - ' &8❙ &fSpeed: &#FFCC00%speed% seconds'
      - ''
      - '&#FFCC00ᴅʀᴏᴘs'
      - ' &#DDDDDD--- 1. ---'
      - ' &8❙ &fItem: &#FFCC00%drop-name-1%'
      - ' &8❙ &fSell-price: &#FFCC00%sell-price-1%$'
      - ' &8❙ &fChance: &#FFCC00%drop-chance-1%%'
      - ' &#DDDDDD--- 2. ---'
      - ' &8❙ &fItem: &#FFCC00%drop-name-2%'
      - ' &8❙ &fSell-price: &#FFCC00%sell-price-2%$'
      - ' &8❙ &fChance: &#FFCC00%drop-chance-2%%'
      - ''
      - '&#FFCC00&l(!) &#FFCC00Place it down to start generating!'
    drop-item:
      # chances don't have to add up to 100%
      # the sell price only works if hooks.price-plugin is set to "builtin"
      # you can customize the item, you can even remove its lore/name
      - chance: 90.0
        sell-price: 50.0
        material: WHEAT
        name: '&#FFCC00&lWHEAT'
        lore:
        - ''
        - ' &7- &fSell price: &#33FF33%sell-price%$'
        - ''
      - chance: 10.0
        sell-price: 100.0
        material: HAY_BLOCK
        name: '&#FFCC00&lHAY BALE'
        lore:
        - ''
        - ' &7- &fSell price: &#33FF33%sell-price%$'
        - ''
    hologram:
      # currently you need a server restart to disable/enable holograms
      enabled: true
      height: 2.25
      lines:
      - '&#FFCC00&lWHEAT GENERATOR'
      - '&#DDDDDDTier: &f%tier%'
      - ''
      - '&fSpawns: &#FFCC00%drop-name%'
      - ''
      - '&#FFCC00Next spawn will be in &f%next-spawn%/%spawn-time% &#FFCC00seconds!'
