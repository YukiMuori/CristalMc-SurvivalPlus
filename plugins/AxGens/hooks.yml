# DOCUMENTATION: https://docs.artillex-studios.com/axgens.html

# what plugin to use for these things?
# if you need another plugin supported, please open a feature request at https://github.com/Artillex-Studios/Issues
# Note: custom should only be used if you have a plugin that uses the API to add a custom hook
hooks:
  # values: Vault, PlayerPoints, CoinsEngine, RoyaleEconomy, EcoBits, custom
  # if the plugin supports multiple currencies, make sure to check the hook-settings and configure the name of the currency
  economy-plugin: Vault
  # which of these price provider plugins should be used for the /selldrops prices?
  # if any of the plugins are not found, those simply won't be registered
  # the highest price is what the item will be sold for if multiple plugins are enabled
  price-plugins:
    builtin: true
    ShopGUIPlus: false
    Essentials: false
    EconomyShopGUI: false
    CMI: false
  # values: builtin, AxHoes, AxPickaxes, CyberLevels, AlonsoLevels, custom
  # you can disable this in the config by setting level-requirements to false
  level-plugin: builtin
  # values: none, SuperiorSkyblock2, BentoBox, KingdomsX, custom
  # NOTE: this disables permission based limits (axgens.limit.X) and ONLY the database will be in use (/axgens slots)
  # team mode combines the generator limit of all team members
  team-plugin: none

hook-settings:
  BentoBox:
    register: true
  CoinsEngine:
    currency-name: coins
  ExcellentEconomy:
    currency-name: coins
  EcoBits:
    currency-name: crystals
  DeluxeSellwands: # currently broken
    register: true
  GriefPrevention:
    register: true
  HuskTowns:
    register: true
  ItemsAdder:
    register: true
  IridiumSkyBlock:
    register: true
  Kingdoms:
    register: true
  SuperiorSkyblock2:
    register: true
    remove-generators-on-disband: true
  Lands:
    register: true
  Oraxen:
    register: true
  Nexo:
    register: true
  WildTools:
    register: true
  WorldGuard:
    register: true
  Residence:
    register: true
  PlotSquared:
    register: true
  Geyser:
    register: true
  ShopGUIPlus:
    # enables/disables https://docs.artillex-studios.com/axgens-shopguiplus-support.html
    register-items: true

# do not change this
version: 9
