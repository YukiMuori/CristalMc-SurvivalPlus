broken-generator: '&#FF3333You have broken a generator! &7(%placed%/%limit%)'
placed-generator: '&#33FF33You have placed a generator! &7(%placed%/%limit%)'
limit-bypass-icon: ∞
place-limit: '&#FF3333You have reached the maximum generator amount! &7(%placed%/%limit%)'
not-your-generator: '&#FF3333This is not your generator!'
generators-too-close: '&#FF3333You must keep at least &f%distance% &#FF3333blocks of distance between generators!'
max: MAX
blacklisted-world: '&#FF3333You cannot place generators in this world!'
