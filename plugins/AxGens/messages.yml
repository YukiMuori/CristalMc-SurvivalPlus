help:
- ' '
- <gradient:#FF7700:#FF9900><b>AxGens</b></gradient> <#FFBB00>Help
- ' <#FFBB00>➤ <white>/axgens give <player> <tier> [amount] <#DDDDDD>| <#FFDD00>Give generators'
- ' <#FFBB00>➤ <white>/axgens givedrop <player> <tier> [amount] <#DDDDDD>| <#FFDD00>Give drops'
- ' <#FFBB00>➤ <white>/axgens sellwand  <player> <name> [amount] <#DDDDDD>| <#FFDD00>Give sell wands'
- ' <#FFBB00>➤ <white>/axgens slots <set/give/take/reset> <player> <amount> <#DDDDDD>| <#FFDD00>Change extra slots'
- ' <#FFBB00>➤ <white>/axgens level <set/give/take/reset> <player> <amount> <#DDDDDD>| <#FFDD00>Change level of player'
- ' <#FFBB00>➤ <white>/axgens list <#DDDDDD>| <#FFDD00>Open generator list'
- ' <#FFBB00>➤ <white>/axgens shop <#DDDDDD>| <#FFDD00>Open generator shop'
- ' <#FFBB00>➤ <white>/axgens event <start/stop> [event-name] <#DDDDDD>| <#FFDD00>Start/end an event'
- ' <#FFBB00>➤ <white>/axgens reload  <#DDDDDD>| <#FFDD00>Reload plugin'
- ' '

stats:
- ' '
- '&#FF6600&lAxGens &#FFCCAAServer Stats &7»'
- ' &7- &fLoaded generators: &#FF6600%loaded%'
- ' &7- &fUnloaded generators: &#FF6600%unloaded%'
- ' &7- &fTotal generators: &#FF6600%total%'
- ' '

event:
  started: '&#33FF33You have started a(n) &f%event-name%&#33FF33!'
  already-running: '&#FF3333An event is already running!'
  ended: '&#FF3333You have ended an event!'
  not-running: '&#FF3333There are no events running!'
  no-event-placeholder: '---'

upgrade:
  success: '&#33FF33You have successfully upgraded the generator to &fTier %tier%&#33FF33!'
  no-money: '&#FF3333You must have &f%money-required%$ &#FF3333to upgrade this generator!'
  low-level: '&#FF3333You must have &f%levels-required% &#FF3333levels to upgrade this generator!'
  maxed: '&#FF3333This generator has reached the maximum tier!'

corrupted:
  repair: '&#33FF33You have successfully repaired the generator!'
  no-money: '&#FF3333You must have &f%money-required% &#FF3333to repair this generator!'
  hologram-line: '&#FF6600⚠ &#FFAA00CORRUPTED &#FF6600⚠'

shop:
  success: '&#33FF33You have successfully purchased a &fTier %tier% &#33FF33generator!'
  no-money: '&#FF3333You must have &f%money-required%$ &#FF3333to buy this generator!'
  low-level: '&#FF3333You must have &f%levels-required% &#FF3333levels to buy this generator!'

reload:
  success: '&#33FF33Plugin successfully reloaded!'
  failed: '&#FF3333Failed to reload the plugin! Something is wrong in the &f%file%&#FF3333 file, look in the console or use a yaml validator to fix the errors!'

give:
  given: '&#33FF33You have given &f%amount%x Tier %tier% &#33FF33generator to &f%player%&#33FF33!'
  not-found: '&#FF3333This generator tier does not exist!'

sellwand:
  given: '&#33FF33You have given &f%amount%x %sellwand% &#33FF33sellwand to &f%player%&#33FF33!'
  sold: '&#33FF33Sold &f%amount% &#33FF33items for &f%price%$&#33FF33!'
  cooldown: '&#FF3333You must wait another &f%time% seconds &#FF3333before using this sellwand again!'
  no-permission: '&#FF3333You don''t have a permission to use a sellwant on this chest!'

slots:
  changed: '&#33FF33You have changed &f%player%&#33FF33''s extra slot amount to &f%amount%&#33FF33!'

multiplier:
  changed: '&#33FF33You have changed &f%player%&#33FF33''s sell multiplier to &fx%amount%&#33FF33!'

# used for the builtin level system
levels:
  changed: '&#33FF33You have changed &f%player%&#33FF33''s level to &f%amount%&#33FF33!'
  disabled: '&#FF3333The builtin level system is disabled!'

# used for the builtin sell system
# set to "" to disable
sell:
  usage: '&#FF3333Incorrect usage! Use /selldrops <all/hand/handall> to sell items!'
  cant-sell: '&#33FF33Nothing was sold!'
  sold: '&#33ff33Sold &f%amount% &#33ff33items for &f%price%$&#33ff33!'
  actionbar: '&#33ff33Sold &f%amount% &#33ff33items for &f%price%$&#33ff33!'
  title:
    title: '&#33FF33&l+%price%'
    subtitle: '&#DDDDDDSold %amount% items'

# /mygenerators
remote-pickup:
  no-permission: '&#FF3333You don''t have a permission to pick up generators from the menu!'

time:
  second: s
  minute: m
  hour: h
  day: d

# list of sounds: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
# set to "" to mute them
sounds:
  upgrade: ENTITY_EXPERIENCE_ORB_PICKUP
  repair: BLOCK_ANVIL_USE
  purchase: ENTITY_EXPERIENCE_ORB_PICKUP
  cant-afford: ENTITY_EXPERIENCE_BOTTLE_THROW
  pickup: BLOCK_NOTE_BLOCK_HAT
  maxed: BLOCK_NOTE_BLOCK_SNARE
  sellwand: ENTITY_VILLAGER_YES

# list of particles: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
# set to "" to disable them
particles:
  upgrade: VILLAGER_HAPPY
  repair: VILLAGER_HAPPY
  pickup: CRIT
  place: SPELL
  sellwand: VILLAGER_HAPPY

converter:
  started: '&#33FF33Started converting... Look in the console for the progress!'
  finished: '&#33FF33Finished converting!'

commands:
  invalid-value: '&#FF0000Invalid parameter: &#BB0000%value%'
  invalid-command: '&#FF0000Invalid command or subcommand!'
  missing-argument: '&#FF0000Missing argument! You must specify a value for &#BB0000%value%&#FF0000.'
  no-permission: '&#FF0000You don''t have permission to access this command!'
  out-of-range: '&#FF0000The &#BB0000%number% &#FF0000must be between &#BB0000%min% &#FF0000and &#BB0000%max%&#FF0000!'
  player-only: '&#FF0000You must be a player to use this command!'
  invalid-player: '&#FF0000The player &#BB0000%player% &#FF0000can not be found!'
  invalid-selector: '&#FF0000You can not use this selector in this command!'

update-notifier: '&#FFBB88There is a new version of AxGens available! &#DDDDDD(&#FFFFFFcurrent: &#FF0000%current% &#DDDDDD| &#FFFFFFlatest: &#00FF00%latest%&#DDDDDD)'

