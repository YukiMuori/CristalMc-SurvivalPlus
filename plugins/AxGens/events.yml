# DOCUMENTATION: https://docs.artillex-studios.com/axgens.html
# valid event types: sell, drop, upgrade, speed

# how often should a random event start? (in minutes)
# you should set this to higher than any of the duration-seconds times
# or otherwise the timer may reset without starting an event
# set to -1 to disable (it requires a restart to disable/enable)
start-event-every-minutes: 60

events:
  # increases the sell price of items
  sell-event:
    enabled: true
    type: sell
    options:
      multiplier: 2.0
      duration-seconds: 180
    display:
      name: sᴇʟʟ ᴘʀɪᴄᴇ ᴇᴠᴇɴᴛ
      # set to "" to disable
      bossbar: '&#FFCC00&l%multiplier%% sᴇʟʟ ᴘʀɪᴄᴇ ᴇᴠᴇɴᴛ &#DDDDDD| &#FFFFFF%time%'
      # pink, blue, red, green, yellow, purple, white
      bossbar-color: yellow
      # progress, notched_6, notched_10, notched_12, notched_20
      bossbar-style: progress
      chat-start: '&eA &#FFCC00&l%multiplier%% sᴇʟʟ ᴘʀɪᴄᴇ ᴇᴠᴇɴᴛ &ehas started! It ends in &#FFFFFF%time%&e!'
      chat-end: '&eA &#FFCC00&l%multiplier%% sᴇʟʟ ᴘʀɪᴄᴇ ᴇᴠᴇɴᴛ &ehas ended!'
  
  # increases the generator drop amount
  drop-event:
    enabled: true
    type: drop
    options:
      multiplier: 2
      duration-seconds: 180
    display:
      name: ᴅʀᴏᴘ ᴇᴠᴇɴᴛ
      bossbar: '&#FFCC00&l%multiplier%x ᴅʀᴏᴘs ᴇᴠᴇɴᴛ &#DDDDDD| &#FFFFFF%time%'
      bossbar-color: yellow
      bossbar-style: progress
      chat-start: '&eA &#FFCC00&l%multiplier%x ᴅʀᴏᴘs ᴇᴠᴇɴᴛ &ehas started! It ends in &#FFFFFF%time%&e!'
      chat-end: '&eA &#FFCC00&l%multiplier%x ᴅʀᴏᴘs ᴇᴠᴇɴᴛ &ehas ended!'
  
  # upgrades generator drops by x tiers
  upgrade-event:
    enabled: true
    type: upgrade
    options:
      bonus-tiers: 1
      duration-seconds: 300
    display:
      name: ᴅʀᴏᴘ ᴛɪᴇʀ ᴜᴘɢʀᴀᴅᴇ ᴇᴠᴇɴᴛ
      bossbar: '&#FFCC00&l+%multiplier% ᴅʀᴏᴘ ᴛɪᴇʀ ᴜᴘɢʀᴀᴅᴇ ᴇᴠᴇɴᴛ &#DDDDDD| &#FFFFFF%time%'
      bossbar-color: yellow
      bossbar-style: progress
      chat-start: '&eA &#FFCC00&l+%multiplier% ᴅʀᴏᴘ ᴛɪᴇʀ ᴜᴘɢʀᴀᴅᴇ ᴇᴠᴇɴᴛ &ehas started! It ends in &#FFFFFF%time%&e!'
      chat-end: '&eA &#FFCC00&l+%multiplier% ᴅʀᴏᴘ ᴛɪᴇʀ ᴜᴘɢʀᴀᴅᴇ ᴇᴠᴇɴᴛ &ehas ended!'
  
  # decreases the generator cooldown
  speed-event:
    enabled: true
    type: speed
    options:
      multiplier: 0.5
      duration-seconds: 180
    display:
      name: ɢᴇɴᴇʀᴀᴛᴏʀ sᴘᴇᴇᴅ ᴇᴠᴇɴᴛ
      bossbar: '&#FFCC00&l%multiplier%% ɢᴇɴᴇʀᴀᴛᴏʀ sᴘᴇᴇᴅ ᴇᴠᴇɴᴛ &#DDDDDD| &#FFFFFF%time%'
      bossbar-color: yellow
      bossbar-style: progress
      chat-start: '&eA &#FFCC00&l%multiplier%% ɢᴇɴᴇʀᴀᴛᴏʀ sᴘᴇᴇᴅ ᴇᴠᴇɴᴛ &ehas started! It ends in &#FFFFFF%time%&e!'
      chat-end: '&eA &#FFCC00&l%multiplier%% ɢᴇɴᴇʀᴀᴛᴏʀ sᴘᴇᴇᴅ ᴇᴠᴇɴᴛ &ehas ended!'

# do not change this
version: 1
