title: "Waypoint"
size: 27

items:
  change_name:
    slot: 9
    material: name_tag
    name: "#e1c4eeChange name"
    lore:
      - ""
      - "&7Current name: &e%waypoint_name%"
      - ""
      - "&e[Click to change the name]"

  change_icon:
    slot: 10
    material: redstone_torch
    name: "#e1c4eeChange icon"
    lore:
      - ""
      - "&7Current icon: &e%waypoint_icon%"
      - ""
      - "&e[Click to change the icon]"

  change_color:
    slot: 11
    material: orange_dye
    name: "#e1c4eeChange background color"
    lore:
      - ""
      - "&7Background color: %waypoint_color%███"
      - ""
      - "&e[Click to change the color]"

  change_icon_color:
    slot: 12
    material: light_gray_dye
    name: "#e1c4eeChange icon color"
    lore:
      - ""
      - "&7Current icon: &e%waypoint_icon%"
      - ""
      - "&e[Click to change the icon color]"

  viewer_mode:
    slot: 13
    material: diamond
    name: "#e1c4eeChange who can see this waypoint"
    lore:
      - ""
      - "&7Mode: &e%waypoint_view_mode%"
      - "&7Permission: &e%waypoint_view_permission%"
      - "&7Rank: &e%waypoint_view_rank%"
      - ""
      - "&a[Click to open the options]"

  hideable:
    slot: 14
    material: ender_eye
    name: "#e1c4eeAllow / Deny hiding waypoint"
    lore:
      - ""
      - "&7Can be hidden: &e%waypoint_hideable%"
      - ""
      - "&e[Click to change]"

  distance_view_min:
    slot: 15
    material: spyglass
    name: "#e1c4eeMinimum view distance"
    lore:
      - ""
      - "&7Minimum distance: &e%waypoint_distance_min%"
      - "&7Set &e-1&7 to&c disable&7 this option"
      - ""
      - "&e[Left click = +1 | Right click = -1]"
      - "&e[Shift + Left click = +10 | Shift + Right click = -10]"

  distance_view_max:
    slot: 16
    material: spyglass
    name: "#e1c4eeMaximum view distance"
    lore:
      - ""
      - "&7Maximum distance: &e%waypoint_distance_max%"
      - "&7Set &e-1&7 to&c disable&7 this option"
      - ""
      - "&e[Left click = +1 | Right click = -1]"
      - "&e[Shift + Left click = +10 | Shift + Right click = -10]"

  remove_range:
    slot: 17
    material: structure_void
    name: "#e1c4eeRemove range: %waypoint_remove_range%"
    lore:
      - ""
      - "&7Distance at which it gets removed for the player: &e%waypoint_remove_range%"
      - "&7Set -1 to&c disable&7 this option"
      -
      - "&e[Left click = +1 | Right click = -1]"
      - "&e[Shift + Left click = +10 | Shift + Right click = -10]"

  delete_waypoint:
    slot: 22
    material: barrier
    name: "&c&l[X]"
    lore:
      - ""
      - "&e[Click to delete the waypoint]"

  change_alpha:
    slot: 18
    material: glass
    name: "#e1c4eeChange background alpha"
    lore:
      - ""
      - "&7Background alpha: &e%waypoint_background_alpha%"
      - ""
      - "&e[Left click = +1 | Right click = -1]"
      - "&e[Shift + Left click = +10 | Shift + Right click = -10]"

  change_scale:
    slot: 26
    material: bone_meal
    name: "#e1c4eeWaypoint scale"
    lore:
      - ""
      - "&7Waypoint scale: &e%waypoint_scale%"
      - ""
      - "&e[Left click = +0.1 | Right click = -0.1]"

  fill:
    slot: "0-52"
    material: black_stained_glass_pane
    name: "&c"
    tooltip: false
